const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}};

function parseRSS(raw,s){const xml=new DOMParser().parseFromString(raw,'text/xml');if(xml.querySelector('parsererror'))throw Error('RSSの形式を解析できません');const items=[...xml.querySelectorAll('item,entry')].slice(0,30);return items.flatMap(n=>{const title=n.querySelector('title')?.textContent?.trim();const link=n.querySelector('link')?.getAttribute('href')||n.querySelector('link')?.textContent?.trim();if(!title||!link||safeUrl(link)==='#')return[];const rawDate=n.querySelector('pubDate,published,updated')?.textContent||'';const d=Date.parse(rawDate);return [{id:id(s.id+link),title,url:link,source:s.name,cat:s.cat,type:classification(title),date:Number.isFinite(d)?new Date(d).toISOString():now(),added:now()}]})}

function tabGo(t){tab=t;query='';category='すべて';render();window.scrollTo(0,0)}
function link(e){return `<a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer" data-open="${esc(e.id)}">${esc(e.title)}</a>`}
function newsCard(e){return `<article class="card"><div class="meta">${esc(e.cat)} · ${esc(e.source)} · ${dateStr(e.date)} ${!seen.includes(e.id)?'<span class="badge">未読</span>':''}</div>${e.cat==='ゲーム'?`<p class="meta">${esc(e.type)}</p>`:''}<h3>${link(e)}</h3><div class="actions"><button data-action="bookmark" data-id="${e.id}">${book.includes(e.id)?'🔖 保存済み':'🔖 ブックマーク'}</button><button data-action="read" data-id="${e.id}">${seen.includes(e.id)?'未読に戻す':'既読'}</button></div></article>`}
function catalogCard(e){return `<article class="card"><div class="row"><img src="https://${esc(e.host)}/favicon.ico" alt="" width="26" height="26" loading="lazy" onerror="this.style.display='none'"><span class="meta">${esc(e.type)}</span></div><h3><a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">${esc(e.name)} ↗</a></h3><div class="actions"><button data-action="favorite" data-url="${esc(e.url)}">${fav.includes(e.url)?'★ お気に入り済み':'☆ お気に入り'}</button></div></article>`}
function filterBar(){return `<input type="search" id="search" placeholder="企業・ゲーム・記事を検索" value="${esc(query)}"><div class="chips">${['すべて','企業','AI','ゲーム'].map(c=>`<button data-category="${c}" class="${category===c?'active':''}">${c}</button>`).join('')}</div>`}
function newsView(saved=false){let a=feed.filter(e=>(!saved||book.includes(e.id))&&(category==='すべて'||e.cat===category)&&(gameFilter==='すべて'||e.type===gameFilter)&&(!unread||!seen.includes(e.id))&&`${e.title} ${e.source} ${e.cat}`.toLowerCase().includes(query.toLowerCase()));a.sort((x,y)=>sort==='source'?x.source.localeCompare(y.source,'ja'):(sort==='new'?-1:1)*(Date.parse(x.date)-Date.parse(y.date)));return filterBar()+`<div class="row"><select id="sort"><option value="new" ${sort==='new'?'selected':''}>新しい順</option><option value="old" ${sort==='old'?'selected':''}>古い順</option><option value="source" ${sort==='source'?'selected':''}>情報源順</option></select><label><input type="checkbox" id="unread" ${unread?'checked':''}>未読のみ</label><button data-action="read-all">すべて既読</button></div>`+(category==='ゲーム'?`<div class="chips">${['すべて','メンテナンス','イベント','アップデート','新コンテンツ','規約・価格変更','サービス終了・移管','新作・コラボ','その他・未分類'].map(c=>`<button data-game="${c}" class="${gameFilter===c?'active':''}">${c}</button>`).join('')}</div>`:'')+`<p class="muted">${a.length}件の記事</p><div class="cards">${a.map(newsCard).join('')||'<div class="panel">該当する記事はありません。お気に入りを登録し、情報収集を試してください。</div>'}</div>`}
function catalogView(saved=false){let a=CATALOG.filter(e=>(!saved||fav.includes(e.url))&&(category==='すべて'||e.type===category)&&`${e.name} ${e.type}`.toLowerCase().includes(query.toLowerCase()));return filterBar()+`<p class="muted">登録 ${CATALOG.length} 件中 ${a.length} 件。公式サイトのリンク集です。すべてがニュース自動取得に対応しているわけではありません。</p><div class="cards">${a.map(catalogCard).join('')}</div>`}
function calendarView(){const y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),weekday=['月','火','水','木','金','土','日'];let cells=weekday.map((x,i)=>`<div class="meta" style="text-align:center;color:${i===6?'#ff9ea6':i===5?'#8ebdff':''}">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<button class="day" disabled></button>';for(let d=1;d<=n;d++){const key=iso(new Date(y,m,d)),count=events.filter(x=>x.date===key).length+feed.filter(x=>iso(new Date(x.date))===key).length;cells+=`<button class="day ${day===key?'chosen':''} ${(first+d-1)%7===6?'sunday':''} ${(first+d-1)%7===5?'saturday':''}" data-day="${key}">${d}<small>${count?count+'件':''}</small></button>`}const matches=events.filter(x=>x.date===day),articles=feed.filter(x=>iso(new Date(x.date))===day);return `<section class="panel"><div class="row between"><button data-action="prev-month">◀</button><strong>${y}年${m+1}月</strong><button data-action="next-month">▶</button></div><p class="muted">月曜始まり。左右スワイプでも月を変更できます。祝日名の自動表示はこの版では未対応です。</p><div class="cal" id="calendar-grid">${cells}</div><h3>${day} の予定・記事</h3>${matches.map(x=>`<div class="line">${esc(x.title)} <button data-action="delete-event" data-id="${esc(x.id)}">削除</button></div>`).join('')}${articles.map(x=>`<div class="line">${link(x)}</div>`).join('')||''}<h3>予定を追加</h3><input id="event-title" placeholder="予定名" style="width:100%"><input id="event-date" type="date" value="${day}" style="width:100%;margin:8px 0"><button class="primary" data-action="add-event">予定を保存</button></section>`}
function render(){const unreadCount=feed.filter(x=>!seen.includes(x.id)).length,unseen=feed.filter(x=>!notices.includes(x.id)).length;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='home'){html=`<div class="hero"><div class="meta">OPEN KNOWLEDGE INFRASTRUCTURE · v1.1 LOCAL</div><h1>必要な情報を、ひとつに。</h1><p class="muted">個人の端末で公式情報を取得。PCやOKI専用サーバーは不要です。</p><button class="primary" data-action="collect">最新情報を取得</button></div><div class="grid">${[['登録情報',CATALOG.length,'catalog'],['お気に入り',fav.length,'saved'],['保存記事',book.length,'saved'],['未読記事',unreadCount,'news']].map(([a,b,c])=>`<button class="card" data-tab="${c}"><div class="stat">${b}</div><div class="muted">${a}</div></button>`).join('')}</div><section class="panel"><h2>新着情報</h2>${feed.slice(0,8).map(x=>`<div class="line"><div class="meta">${esc(x.source)} · ${dateStr(x.date)}</div>${link(x)}</div>`).join('')||'<p>まだ記事がありません。企業・ゲームをお気に入り登録してください。</p>'}</section><section class="panel"><h2>収集条件</h2><p class="muted">お気に入り限定・30分間隔・アプリを開いている間のみ。Wi-Fiと省電力OFFは設定画面で確認してください。</p><button data-tab="settings">設定を開く</button></section>`}
if(tab==='news')html=newsView();if(tab==='catalog')html=catalogView();if(tab==='saved')html=`<h2>お気に入り・ブックマーク</h2><h3>保存記事</h3>`+newsView(true)+`<h3>お気に入り企業・ゲーム</h3>`+catalogView(true);if(tab==='notifications')html=`<section class="panel"><div class="row between"><h2>通知センター · 未確認 ${unseen}件</h2><button data-action="notice-all">すべて確認済み</button></div><p class="muted">アプリ内通知です。アプリを閉じている間のプッシュ通知はありません。</p>${feed.slice(0,100).map(x=>`<div class="line"><div class="meta">${esc(x.source)} · ${notices.includes(x.id)?'確認済み':'未確認'}</div>${link(x)}<div><button data-action="notice" data-id="${x.id}">${notices.includes(x.id)?'未確認に戻す':'確認済み'}</button></div></div>`).join('')||'まだ通知はありません。'}</section>`;if(tab==='calendar')html=calendarView();if(tab==='settings')html=`<section class="panel"><h2>端末側の情報収集設定</h2><p>取得対象：お気に入りのみ ／ 最短30分間隔 ／ アプリ起動中のみ</p><label><input type="checkbox" id="manual" ${permitted()?'checked':''}>Wi-Fi接続中・省電力モードOFFを自分で確認した</label><p class="muted">スマホブラウザはWi-Fiと省電力モードを確実に判定できません。条件が変わったらチェックを外してください。</p><p>収集対応のお気に入り：${targets().length}情報源</p><button class="primary" data-action="collect">今すぐ取得を試す</button><p class="muted">30分未満の再取得は行いません。CORS制限のある情報源は取得できません。</p></section><section class="panel"><h2>情報源の状態</h2>${SOURCES.map(s=>{const c=checks.find(x=>x.name===s.name);return `<div class="line source"><b>${esc(s.name)}</b> · ${c?(c.ok?`取得 ${c.count}件`:`取得不可：${esc(c.message)}`):'未確認'}<div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">公式フィード ↗</a></div></div>`}).join('')}</section><section class="panel"><h2>データのバックアップ</h2><p class="muted">データはこのブラウザの保存領域にあります。SafariとChromeの間では自動共有されません。</p><button data-action="export">JSONをコピー</button><textarea id="import" rows="3" placeholder="バックアップJSONを貼り付け"></textarea><button data-action="import">バックアップを読み込む</button></section><section class="panel"><h2>翻訳について</h2><p>自動翻訳は未実装です。記事の原文を表示します。ブラウザのページ翻訳機能は利用できます。</p></section>`;$('#view').innerHTML=html;$('#nav-notice').textContent=unseen?' '+unseen:'';if(tab==='calendar'){let startX=0;$('#calendar-grid').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('#calendar-grid').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>65)moveMonth(dx<0?1:-1)},{passive:true})}}
function moveMonth(d){const n=new Date(month.getFullYear(),month.getMonth()+d,1);const max=new Date(new Date().getFullYear()+1,11,1);if(n<new Date(2026,0,1)||n>max)return;month=n;render()}
function backup(){return JSON.stringify({version:11,favorites:fav,bookmarks:book,read:seen,notices,events,feed,checks},null,2)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tabGo(b.dataset.tab);return}if(b.dataset.category){category=b.dataset.category;gameFilter='すべて';render();return}if(b.dataset.game){gameFilter=b.dataset.game;render();return}if(b.dataset.day){day=b.dataset.day;render();return}const action=b.dataset.action,id=b.dataset.id;if(action==='favorite')toggleFav(b.dataset.url);if(action==='bookmark')toggleBook(id);if(action==='read')toggleRead(id);if(action==='read-all'){seen=[...new Set([...seen,...feed.map(x=>x.id)])];save('read',seen);render()}if(action==='collect')await collect();if(action==='notice'){notices=notices.includes(id)?notices.filter(x=>x!==id):[...notices,id];save('notice-seen',notices);render()}if(action==='notice-all'){notices=feed.map(x=>x.id);save('notice-seen',notices);render()}if(action==='prev-month')moveMonth(-1);if(action==='next-month')moveMonth(1);if(action==='add-event'){const title=$('#event-title').value.trim(),date=$('#event-date').value;if(title&&date){events.push({id:'manual-'+Date.now(),title,date,url:''});save('events',events);day=date;render()}else alert('予定名と日付を入力してください')}if(action==='delete-event'){events=events.filter(x=>x.id!==id);save('events',events);render()}if(action==='export'){const txt=backup();try{await navigator.clipboard.writeText(txt);status('バックアップJSONをコピーしました')}catch{prompt('次のJSONをコピーしてください',txt)}}if(action==='import'){try{const x=JSON.parse($('#import').value);if(!Array.isArray(x.favorites)||!Array.isArray(x.feed))throw Error('形式が違います');if(!confirm('現在の端末データをバックアップ内容で置き換えますか？'))return;for(const [k,v] of [['favorites',x.favorites],['bookmarks',x.bookmarks||[]],['read',x.read||[]],['notice-seen',x.notices||[]],['events',x.events||[]],['feed',x.feed],['checks',x.checks||[]]])save(k,v);location.reload()}catch{status('バックアップJSONが正しくありません',true)}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[data-open]');if(a){const id=a.dataset.open;if(!seen.includes(id)){seen.push(id);save('read',seen)}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const p=e.target.selectionStart;query=e.target.value;render();const s=$('#search');s?.focus();s?.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;render()}if(e.target.id==='unread'){unread=e.target.checked;render()}if(e.target.id==='manual'){save('manual-ok',e.target.checked);status(e.target.checked?'取得条件を確認済みにしました':'自動取得を停止しました')}});
render();document.getElementById("status").textContent="OKI ベータテスト版：画面操作の準備完了";let lastVisible=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){lastVisible=true;return}if(lastVisible&&permitted()&&Date.now()-last>=1800000)collect()});setInterval(()=>{if(!document.hidden&&permitted()&&Date.now()-last>=1800000&&targets().length)collect()},60000);
</script></body></html>
